name: Trunk Code Quality setup
description: Set up dependencies for Trunk Code Quality

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v6.1.0 # zizmor: ignore[unpinned-uses]

        - name: Setup Node.js
          uses: actions/setup-node@v7.0.0 # zizmor: ignore[unpinned-uses]
          with:
              node-version: 24

        - name: Install workspace dependencies
          shell: bash
          run: |
              pnpm install --frozen-lockfile

        - name: Generate SvelteKit configurations
          shell: bash
          run: |
              pnpm exec svelte-kit sync
              pnpm --filter docs exec svelte-kit sync
