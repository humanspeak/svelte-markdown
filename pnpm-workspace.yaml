packages:
    - .
    - docs

allowBuilds:
    '@humanspeak/docs-kit@https://codeload.github.com/humanspeak/docs-kit/tar.gz/2e6c93b8672a2f670c058efe122a2f245a5c3d3b': true
    '@humanspeak/docs-kit': true
    esbuild: true
    sharp: true
    workerd: true

onlyBuiltDependencies:
    - '@humanspeak/docs-kit'
    - esbuild
    - sharp
    - workerd

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
    - '@humanspeak/*'
