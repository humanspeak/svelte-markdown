packages:
    - .
    - docs

overrides:
    # SvelteKit still requests cookie 0.6.0 (CVE-2024-47764).
    '@sveltejs/kit>cookie': ^0.7.2
    # Mermaid 12's Chevrotain dependencies pin vulnerable lodash-es 4.17.23.
    # CVE-2026-4800 and CVE-2026-2950; remove once upstream uses patched versions.
    'lodash-es@<4.18.0': ^4.18.1

allowBuilds:
    '@humanspeak/docs-kit@git+https://github.com/humanspeak/docs-kit.git': true
    '@humanspeak/docs-kit@https://codeload.github.com/humanspeak/docs-kit/tar.gz/9650ea563bc94ed534543644d5a46c5ab540b62f': true
    esbuild: true
    sharp: true
    workerd: true

onlyBuiltDependencies:
    - '@humanspeak/docs-kit'
    - esbuild
    - sharp
    - workerd

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
    - '@humanspeak/*'
