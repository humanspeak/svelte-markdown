packages:
    - .
    - docs

allowBuilds:
    '@humanspeak/docs-kit@https://codeload.github.com/humanspeak/docs-kit/tar.gz/e65933a409be4be8d4663220d0271e3f0e654ab5': true
    '@humanspeak/docs-kit': true
    esbuild: true
    sharp: true
    workerd: true

onlyBuiltDependencies:
    - '@humanspeak/docs-kit'
    - esbuild
    - sharp
    - workerd

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
    - '@humanspeak/*'
