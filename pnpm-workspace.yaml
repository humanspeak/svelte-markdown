packages:
    - .
    - docs

allowBuilds:
    '@humanspeak/docs-kit@git+https://github.com/humanspeak/docs-kit.git': true
    '@humanspeak/docs-kit@https://codeload.github.com/humanspeak/docs-kit/tar.gz/5d2dc04f47eff8df92a181dabdcf59bf2b1c94db': true
    esbuild: true
    sharp: true
    workerd: true

onlyBuiltDependencies:
    - '@humanspeak/docs-kit'
    - esbuild
    - sharp
    - workerd

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
    - '@humanspeak/*'
