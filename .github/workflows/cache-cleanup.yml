name: Cache Cleanup

permissions:
    actions: write

on:
    schedule:
        - cron: 0 0 1 * * # Monthly cleanup
    workflow_dispatch: # Manual trigger

jobs:
    cleanup:
        runs-on: ubuntu-latest
        steps:
            - name: Cleanup
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  BRANCH: main
              run: |
                  gh cache delete --all --repo "$REPO" --ref "refs/heads/$BRANCH" --succeed-on-no-caches
