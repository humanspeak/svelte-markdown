name: Trunk Code Quality Check
on: [pull_request]
concurrency:
    group: ${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

permissions: read-all

jobs:
    trunk_check:
        name: Trunk Code Quality Runner
        runs-on: ubuntu-latest
        permissions:
            checks: write # For trunk to post annotations
            contents: read # For repo checkout

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1 # zizmor: ignore[unpinned-uses]
              with:
                  persist-credentials: false

            - name: Set up Trunk dependencies
              uses: $/.trunk/setup-ci

            - name: Trunk Code Quality
              uses: trunk-io/trunk-action@v2.0.0 # zizmor: ignore[unpinned-uses]
