name: Trunk Code Quality Check
on: [pull_request]
concurrency:
    group: ${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

permissions: read-all

jobs:
    trunk_check:
        name: Trunk Code Quality Runner
        runs-on: ubuntu-latest
        permissions:
            checks: write # For trunk to post annotations
            contents: read # For repo checkout

        steps:
            - name: Checkout
              uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v6 # zizmor: ignore[unpinned-uses]

            - name: Use Node.js - 24
              uses: actions/setup-node@v7 # zizmor: ignore[unpinned-uses]
              with:
                  node-version: 24

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate SvelteKit configuration
              run: pnpm exec svelte-kit sync

            - name: Trunk Code Quality
              uses: trunk-io/trunk-action@v1 # zizmor: ignore[unpinned-uses]
